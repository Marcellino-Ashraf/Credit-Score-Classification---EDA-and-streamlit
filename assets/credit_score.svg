<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="Credit score gauge from Poor to Good next to a credit card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#CFFAFE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164E63"/>
      <stop offset="0.55" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <rect width="520" height="300" rx="16" fill="url(#bg)"/>

  <!-- Credit card -->
  <g transform="translate(300 70) rotate(-8)">
    <rect width="190" height="120" rx="14" fill="url(#card)"/>
    <rect x="18" y="30" width="34" height="26" rx="5" fill="#FDE68A"/>
    <line x1="18" y1="43" x2="52" y2="43" stroke="#D97706" stroke-width="1.5"/>
    <line x1="35" y1="30" x2="35" y2="56" stroke="#D97706" stroke-width="1.5"/>
    <g fill="#FFFFFF" opacity="0.9">
      <rect x="18" y="74" width="30" height="7" rx="3"/>
      <rect x="56" y="74" width="30" height="7" rx="3"/>
      <rect x="94" y="74" width="30" height="7" rx="3"/>
      <rect x="132" y="74" width="30" height="7" rx="3"/>
      <rect x="18" y="94" width="70" height="6" rx="3" opacity="0.6"/>
    </g>
    <circle cx="150" cy="30" r="12" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="166" cy="30" r="12" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- Gauge: Poor (red), Standard (amber), Good (green) -->
  <g transform="translate(160 205)">
    <path d="M -120 0 A 120 120 0 0 1 -60 -103.9" fill="none" stroke="#DC2626" stroke-width="26"/>
    <path d="M -60 -103.9 A 120 120 0 0 1 60 -103.9" fill="none" stroke="#F59E0B" stroke-width="26"/>
    <path d="M 60 -103.9 A 120 120 0 0 1 120 0" fill="none" stroke="#16A34A" stroke-width="26"/>
    <!-- needle pointing into the Good zone -->
    <line x1="0" y1="0" x2="72" y2="-78" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
    <circle r="14" fill="#0F172A"/>
    <circle r="5" fill="#FFFFFF"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
      <text x="-112" y="30" fill="#B91C1C">Poor</text>
      <text x="0" y="-145" fill="#B45309">Standard</text>
      <text x="112" y="30" fill="#15803D">Good</text>
    </g>
  </g>
</svg>
